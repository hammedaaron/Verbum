<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="silver-rim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <!-- Deep Black Background -->
  <rect width="512" height="512" rx="96" fill="#0d0d0f"/>
  <!-- Sleek Metallic Rim -->
  <rect x="20" y="20" width="472" height="472" rx="76" fill="none" stroke="url(#silver-rim)" stroke-width="3" opacity="0.4"/>
  
  <g transform="translate(40, 20)">
    <!-- Calligraphic 'V' Letter Flourish -->
    <path d="M 120 180 C 100 130 160 110 200 130 C 230 145 235 180 220 230 L 175 350 C 165 375 190 390 215 370 C 240 350 280 280 320 200" 
          fill="none" stroke="url(#silver-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <path d="M 195 132 C 165 145 135 170 125 210 C 115 250 140 280 165 320" 
          fill="none" stroke="url(#silver-grad)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

    <!-- Fountain Pen Nib -->
    <g transform="translate(255, 130) rotate(35)">
      <!-- Nib Body -->
      <path d="M 0 0 L 32 -70 L 64 0 L 50 140 L 14 140 Z" fill="#18181b" stroke="url(#silver-grad)" stroke-width="5"/>
      <!-- Inner Engraving Detail -->
      <path d="M 32 -70 L 32 40" stroke="url(#silver-grad)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="32" cy="40" r="5" fill="url(#silver-grad)"/>
      <path d="M 18 -15 C 24 5 40 5 46 -15" fill="none" stroke="url(#silver-grad)" stroke-width="3"/>
      <!-- Pen Collar Rings -->
      <rect x="10" y="140" width="44" height="14" rx="3" fill="#27272a" stroke="url(#silver-grad)" stroke-width="3"/>
      <rect x="6" y="156" width="52" height="60" rx="4" fill="#09090b" stroke="url(#silver-grad)" stroke-width="3"/>
    </g>
  </g>

  <!-- Verbum Typography Mark -->
  <text x="256" y="430" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="34" font-weight="700" letter-spacing="9" fill="url(#silver-grad)">
    VERBUM
  </text>
  <text x="256" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" letter-spacing="4" fill="#94a3b8" opacity="0.8">
    MANUSCRIPT ENGINE
  </text>
</svg>
